name: Feature request
description: Propose a generic capability or improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the generic problem without coupling the proposal to one website when a reusable capability can solve it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: What should DABot be able to do?
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example scenarios
      description: Give one or more concrete examples that demonstrate the need.
  - type: textarea
    id: architecture
    attributes:
      label: Architecture considerations
      description: Note affected Core/Application/Infrastructure/Runner boundaries, durability, security, or compatibility concerns if known.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
