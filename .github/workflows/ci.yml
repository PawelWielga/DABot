name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DesktopAutomationBot.sln

      - name: Build
        run: dotnet build DesktopAutomationBot.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DesktopAutomationBot.sln --configuration Release --no-build --verbosity normal
