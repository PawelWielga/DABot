name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DesktopAutomationBot.sln

      - name: Build
        run: dotnet build DesktopAutomationBot.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DesktopAutomationBot.sln --configuration Release --no-build --verbosity normal

      - name: Verify runner exit codes
        shell: bash
        run: |
          set +e
          dotnet run --project src/DesktopAutomationBot.Runner --configuration Release --no-build -- invalid-command
          usage_exit=$?
          set -e

          if [ "$usage_exit" -ne 2 ]; then
            echo "Expected invalid command to exit with 2, got $usage_exit."
            exit 1
          fi

          cat > config.local.json <<'JSON'
          {
            "bot": {
              "scenarioPath": "scenarios/does-not-exist.json"
            }
          }
          JSON

          set +e
          dotnet run --project src/DesktopAutomationBot.Runner --configuration Release --no-build -- run
          input_exit=$?
          set -e
          rm -f config.local.json

          if [ "$input_exit" -ne 3 ]; then
            echo "Expected missing scenario to exit with 3, got $input_exit."
            exit 1
          fi

      - name: Install Playwright Chromium
        run: pwsh src/DesktopAutomationBot.Infrastructure/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Configure self-contained smoke scenario
        shell: bash
        run: |
          cat > config.local.json <<'JSON'
          {
            "bot": {
              "scenarioPath": "examples/form-interaction.json"
            }
          }
          JSON

      - name: Smoke test runner
        run: dotnet run --project src/DesktopAutomationBot.Runner --configuration Release --no-build
