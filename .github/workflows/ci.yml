name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DesktopAutomationBot.sln

      - name: Restore web demo
        run: dotnet restore src/DesktopAutomationBot.Web.Demo/DesktopAutomationBot.Web.Demo.csproj

      - name: Build
        run: dotnet build DesktopAutomationBot.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DesktopAutomationBot.sln --configuration Release --no-build --verbosity normal

      - name: Verify runner CLI and exit codes
        shell: bash
        run: |
          dotnet run --project src/DesktopAutomationBot.Runner --configuration Release --no-build -- --help

          set +e
          dotnet run --project src/DesktopAutomationBot.Runner --configuration Release --no-build -- invalid-command
          usage_exit=$?
          set -e

          if [ "$usage_exit" -ne 2 ]; then
            echo "Expected invalid command to exit with 2, got $usage_exit."
            exit 1
          fi

          set +e
          dotnet run --project src/DesktopAutomationBot.Runner --configuration Release --no-build -- run --scenario scenarios/does-not-exist.json
          input_exit=$?
          set -e

          if [ "$input_exit" -ne 3 ]; then
            echo "Expected missing CLI scenario to exit with 3, got $input_exit."
            exit 1
          fi

      - name: Publish web management host
        run: >
          dotnet publish src/DesktopAutomationBot.Web/DesktopAutomationBot.Web.csproj
          --configuration Release
          --no-restore
          --output artifacts/publish/web

      - name: Publish static web demo
        run: >
          dotnet publish src/DesktopAutomationBot.Web.Demo/DesktopAutomationBot.Web.Demo.csproj
          --configuration Release
          --no-restore
          --output artifacts/publish/web-demo

      - name: Verify static web demo output
        shell: bash
        run: |
          test -f artifacts/publish/web-demo/wwwroot/index.html
          test -f artifacts/publish/web-demo/wwwroot/_framework/blazor.webassembly.js
          test -f artifacts/publish/web-demo/wwwroot/_content/DesktopAutomationBot.Web.Shared/app.css

      - name: Publish Linux runner
        run: >
          dotnet publish src/DesktopAutomationBot.Runner/DesktopAutomationBot.Runner.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained false
          --output artifacts/publish/linux-x64

      - name: Smoke test published Linux runner
        shell: bash
        run: |
          test -x artifacts/publish/linux-x64/DesktopAutomationBot.Runner

          set +e
          artifacts/publish/linux-x64/DesktopAutomationBot.Runner invalid-command
          publish_exit=$?
          set -e

          if [ "$publish_exit" -ne 2 ]; then
            echo "Expected published runner invalid command to exit with 2, got $publish_exit."
            exit 1
          fi

      - name: Install Playwright Chromium
        run: pwsh src/DesktopAutomationBot.Infrastructure/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Smoke test runner
        run: >
          dotnet run --project src/DesktopAutomationBot.Runner
          --configuration Release
          --no-build
          --
          run
          --scenario examples/form-interaction.json
