name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DesktopAutomationBot.sln

      - name: Build
        run: dotnet build DesktopAutomationBot.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test DesktopAutomationBot.sln --no-build --configuration Release
